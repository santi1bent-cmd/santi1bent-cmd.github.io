<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quotes — A Curious Loop" />
  <title>Quotes · A Curious Loop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo"><img src="images/logo.png" alt="A Curious Loop" class="nav-logo-img"></a>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="quotes.html" class="active">Quotes</a></li>
      <li><a href="research.html">Research</a></li>
    </ul>
  </nav>

  <div class="page">
    <div class="container">

      <!-- ── Random quote stage ── -->
      <section class="quote-stage fade-in" aria-live="polite">
        <p class="quote-text" id="quote-text">
          &ldquo;&rdquo;
        </p>
        <span class="quote-author" id="quote-author"></span>

        <div class="quote-controls">
          <button class="quote-btn" id="btn-prev" aria-label="Previous quote">← prev</button>
          <button class="quote-btn" id="btn-next" aria-label="Next quote">next →</button>
        </div>
      </section>

      <!-- ── Full archive ── -->
      <section class="quote-archive fade-in fade-in-delay-2">
        <p class="quote-archive-header">All quotes</p>
        <div id="quote-list">
          <!-- Populated by app.js -->
        </div>
      </section>

    </div>
  </div>

  <footer>
    <span class="footer-loop">∞</span>
  </footer>

  <script src="data/quotes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
