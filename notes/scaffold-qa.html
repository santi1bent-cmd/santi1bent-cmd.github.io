  <title>Does a benchmark score measure the model, or the scaffold around it? · A Curious Loop</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .note-header {
      padding: 6rem 0 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
    }
    .note-header h1 {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 300;
      line-height: 1.25;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .note-header-meta {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .note-back {
      font-family: var(--font-ui);
      font-size: 0.68rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: inline-block;
      margin-bottom: 2rem;
      transition: color 0.2s;
    }
    .note-back:hover { color: var(--accent); }

    /* PDF viewer — desktop */
    .pdf-viewer {
      width: 100%;
      height: 85vh;
      border: 1px solid var(--border-light);
      background: #fff;
      display: block;
      margin-bottom: 6rem;
    }

    .pdf-mobile {
      display: none;
      padding: 4rem 0 6rem;
      text-align: center;
    }
    .pdf-open-btn {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent-dim);
      padding: 0.85rem 2rem;
      display: inline-block;
      transition: all 0.3s ease;
    }
    .pdf-open-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    @media (max-width: 768px) {
      .pdf-viewer { display: none; }
      .pdf-mobile { display: block; }
    }
  </style>
</head>
<body>

  <nav>

      </header>

      <!-- Desktop: embedded PDF -->
      <iframe
        class="pdf-viewer fade-in fade-in-delay-1"
        src="scaffold-protocolqa.pdf"
        title="Does a benchmark score measure the model, or the scaffold around it?">
      </iframe>

      <!-- Mobile: native PDF link -->
      <div class="pdf-mobile fade-in fade-in-delay-1">

      </div>


    </div>
